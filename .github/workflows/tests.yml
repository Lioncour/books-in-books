name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests run offline and never load spaCy, so the 500 MB model is not needed
      - name: Install test dependencies
        run: pip install flask requests ebooklib anthropic
      - name: Run tests
        run: python -m unittest discover -s tests -v
