<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify references — Books in Books</title>
    <meta name="description" content="Compare stored book references with a fresh scan of your files.">
    <meta name="theme-color" content="#0f5c5c">
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            overflow: auto;
            min-height: 100vh;
        }

        .verify-page {
            max-width: 720px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem 4rem;
        }

        .verify-back {
            display: inline-block;
            margin-bottom: 1.75rem;
            font-size: 0.9rem;
            color: var(--muted);
            text-decoration: none;
        }

        .verify-back:hover {
            color: var(--accent);
        }

        .verify-brand {
            font-family: var(--font-display);
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .verify-lede {
            margin-top: 0.5rem;
            color: var(--muted);
            max-width: 40ch;
        }

        .verify-loading,
        .verify-error {
            margin-top: 2rem;
            padding: 1.25rem;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--ink-soft);
            font-size: 0.95rem;
        }

        .verify-error {
            border-color: var(--danger);
            color: var(--danger);
        }

        .book-block {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--line);
        }

        .book-block .title {
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 600;
        }

        .book-block .author {
            color: var(--muted);
            margin-top: 0.2rem;
            margin-bottom: 1rem;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .stat {
            border: 1px solid var(--line);
            padding: 0.75rem;
            background: rgba(244, 247, 245, 0.7);
        }

        .stat .label {
            font-size: 0.7rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .stat .value {
            font-family: var(--font-display);
            font-size: 1.35rem;
            margin-top: 0.2rem;
            color: var(--ink);
        }

        .stat .value.ok { color: var(--accent); }
        .stat .value.warn { color: var(--danger); }

        .ref-block {
            margin-top: 1.25rem;
        }

        .ref-block h3 {
            font-family: var(--font-display);
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }

        .ref-row {
            padding: 0.55rem 0;
            border-bottom: 1px solid var(--line);
        }

        .ref-row .name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .ref-row .by {
            display: block;
            font-size: 0.8rem;
            color: var(--muted);
        }

        .badge {
            display: inline-block;
            margin-left: 0.4rem;
            font-size: 0.65rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 0.15rem 0.4rem;
            border: 1px solid var(--line);
            color: var(--ink-soft);
        }

        .badge.match {
            border-color: var(--accent);
            color: var(--accent);
        }

        .context {
            margin-top: 0.4rem;
            padding: 0.5rem 0.65rem;
            background: rgba(28, 36, 33, 0.04);
            font-size: 0.82rem;
            color: var(--ink-soft);
        }

        @media (max-width: 640px) {
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="verify-page">
        <a class="verify-back" href="/">← Back to Books in Books</a>
        <p class="verify-brand">Verify references</p>
        <p class="verify-lede">Compare what is stored in the database with a fresh scan of your book files. For checking accuracy — not everyday browsing.</p>

        <div id="loading" class="verify-loading">
            Analyzing books. This may take a minute…
        </div>
        <div id="error-container"></div>
        <div id="verification-results"></div>
    </div>

    <script>
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text == null ? '' : String(text);
            return div.innerHTML;
        }

        async function loadVerification() {
            try {
                const response = await fetch('/api/verify');
                const data = await response.json();
                document.getElementById('loading').style.display = 'none';
                if (!response.ok) throw new Error(data.error || 'Verification failed');
                displayResults(data);
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error-container').innerHTML =
                    `<div class="verify-error"><strong>Error:</strong> ${escapeHtml(error.message)}</div>`;
            }
        }

        function displayResults(data) {
            const container = document.getElementById('verification-results');
            if (!data.books || data.books.length === 0) {
                container.innerHTML = '<div class="verify-error">No processed books found. Add books and extract references first.</div>';
                return;
            }

            container.innerHTML = data.books.map(book => {
                if (book.error) {
                    return `<article class="book-block">
                        <div class="title">${escapeHtml(book.title)}</div>
                        <div class="author">${escapeHtml(book.author || '')}</div>
                        <div class="verify-error">${escapeHtml(book.error)}</div>
                    </article>`;
                }

                const onlyInDb = book.only_in_database || [];
                const onlyInText = book.only_in_text || [];
                const warnings = onlyInDb.length + onlyInText.length;

                return `<article class="book-block">
                    <div class="title">${escapeHtml(book.title)}</div>
                    <div class="author">${escapeHtml(book.author || 'Unknown')}</div>
                    <div class="stats-row">
                        <div class="stat"><div class="label">In database</div><div class="value">${book.db_references_count || 0}</div></div>
                        <div class="stat"><div class="label">Found in text</div><div class="value">${book.found_references_count || 0}</div></div>
                        <div class="stat"><div class="label">Matches</div><div class="value ok">${book.matches || 0}</div></div>
                        <div class="stat"><div class="label">Warnings</div><div class="value ${warnings ? 'warn' : ''}">${warnings}</div></div>
                    </div>
                    ${book.db_references?.length ? `
                        <div class="ref-block">
                            <h3>In database</h3>
                            ${book.db_references.map(ref => `
                                <div class="ref-row">
                                    <span class="name">${escapeHtml(ref.title)}</span>
                                    <span class="by">${escapeHtml(ref.author || '')}</span>
                                </div>`).join('')}
                        </div>` : ''}
                    ${book.found_references?.length ? `
                        <div class="ref-block">
                            <h3>Found in text</h3>
                            ${book.found_references.map(ref => {
                                const isMatch = book.matched_titles && book.matched_titles.includes(ref.title.toLowerCase());
                                return `<div class="ref-row">
                                    <span class="name">${escapeHtml(ref.title)}
                                        <span class="badge ${isMatch ? 'match' : ''}">${isMatch ? 'Match' : 'New'}</span>
                                    </span>
                                    ${(ref.contexts || []).slice(0, 2).map(ctx =>
                                        `<div class="context">…${escapeHtml(ctx)}…</div>`
                                    ).join('')}
                                </div>`;
                            }).join('')}
                        </div>` : ''}
                    ${onlyInDb.length ? `
                        <div class="ref-block">
                            <h3>Only in database</h3>
                            ${onlyInDb.map(t => `<div class="ref-row"><span class="name">${escapeHtml(t)}</span></div>`).join('')}
                        </div>` : ''}
                    ${onlyInText.length ? `
                        <div class="ref-block">
                            <h3>Only in text</h3>
                            ${onlyInText.map(t => `<div class="ref-row"><span class="name">${escapeHtml(t)}</span></div>`).join('')}
                        </div>` : ''}
                </article>`;
            }).join('');
        }

        loadVerification();
    </script>
</body>
</html>
