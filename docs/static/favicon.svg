  <!-- outer book -->
  <rect x="5" y="6" width="14" height="20" rx="1.5" fill="none" stroke="#0f5c5c" stroke-width="2"/>
  <path d="M7 6.5 V25.5" fill="none" stroke="#0f5c5c" stroke-width="1.4" stroke-linecap="round"/>
  <!-- inner book -->
